name: Release

# A version tag (vX.Y.Z on main) builds every installer and attaches them to a DRAFT GitHub Release. A manual run from main is a dry run:
# same build and checks, no Release, files kept as a workflow artifact. Never runs on pull requests or forks. How to cut one: docs/release.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: github.repository == 'pochimail/pochimail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ref.outputs.version }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version
        id: ref
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag (vX.Y.Z): $REF_NAME"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::The tag is not on main"; exit 1; }
            version="${REF_NAME#v}"
            publish=true
          else
            [ "$REF_NAME" = main ] || { echo "::error::A dry run starts from main"; exit 1; }
            version="$(jq -r .version apps/desktop/package.json)"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    # Signing secrets live in this protected environment. Each OS gets only its own, mapped here because a step `if:` cannot test `secrets.*`:
    # the signing-mode script (apps/desktop/packaging/signing-mode.ts) reads these variables and decides signed, unsigned or invalid.
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, runner: macos-latest }
          - { platform: windows, runner: windows-latest }
          - { platform: linux, runner: ubuntu-24.04 }
    env:
      POCHIMAIL_RELEASE_BUILD: "1"
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      AZURE_TENANT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_TS_ENDPOINT: ${{ matrix.platform == 'windows' && secrets.AZURE_TS_ENDPOINT || '' }}
      AZURE_TS_ACCOUNT: ${{ matrix.platform == 'windows' && secrets.AZURE_TS_ACCOUNT || '' }}
      AZURE_TS_PROFILE: ${{ matrix.platform == 'windows' && secrets.AZURE_TS_PROFILE || '' }}
      AZURE_TS_PUBLISHER: ${{ matrix.platform == 'windows' && secrets.AZURE_TS_PUBLISHER || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xvfb
      # One line per OS, and a partial set of secrets fails here, before anything is built.
      - name: Signing mode
        shell: bash
        run: pnpm --filter @pochimail/desktop package:signing ${{ matrix.platform }}
      - name: Set the app version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cd apps/desktop && npm pkg set version="$VERSION"
      - name: Package
        run: pnpm --filter @pochimail/desktop package
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: matrix.platform != 'linux'
        run: pnpm --filter @pochimail/desktop package:smoke
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:smoke
      # Installs each installer and launches it; on a signed build it also verifies the signature and notarization.
      - name: Install and launch each artifact
        if: matrix.platform != 'linux'
        run: pnpm --filter @pochimail/desktop package:install
      - name: Install and launch each artifact
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:install
      - name: Verify artifacts and signatures
        run: pnpm --filter @pochimail/desktop package:verify
      - name: Report artifact sizes
        run: pnpm --filter @pochimail/desktop package:size "${{ matrix.platform }} artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            apps/desktop/release/Pochimail-*
            apps/desktop/release/signing-*.txt
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      # Fails unless all five installers are there; adds SHA256SUMS, latest.json (the version only) and the notes.
      - name: Checksums, version file and notes
        run: node apps/desktop/packaging/finalize-release.ts release-files "$VERSION"
      - name: Keep the files of a dry run
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: release-files
          retention-days: 7
          if-no-files-found: error
      - name: Draft the GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Pochimail $VERSION" \
            --notes-file release-files/RELEASE_NOTES.md \
            release-files/Pochimail-* release-files/SHA256SUMS release-files/latest.json
