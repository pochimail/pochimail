name: CI

on:
  pull_request:
  # GitHub merge queue: every required job below (check, package and e2e x3, eval, osv-scanner) runs for real on merge_group; only the macOS/Windows jobs are skipped, and only on pull_request.
  merge_group:
    types: [checks_requested]
  # Feature-branch pushes are covered by pull_request; only run push CI on main (avoids double runs).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is unique per merge queue entry (refs/heads/gh-readonly-queue/...), so entries never share a group; never cancel queue runs.
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  # Required status checks (branch protection), names must stay stable:
  #   check, package and e2e, each as (ubuntu-latest) (macos-latest) (windows-latest), plus eval and osv-scanner
  # Pull requests get fast Linux feedback only. macOS and Windows are skipped on pull_request (GitHub treats a skipped required check as passing) and run for real on merge_group and push to main, so no PR or merge-queue entry can reach main without the 3-OS gate. Direct pushes by admins are a branch-protection setting (enforce_admins), not covered here.
  # These are explicit jobs, not a matrix: a matrix job skipped by a job-level `if` reports the unexpanded name `check (${{ matrix.os }})`, so the required names would never appear and the PR would block. The steps live once, in .github/actions/check.
  check-linux:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  check-macos:
    name: check (macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  check-windows:
    name: check (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  # Unsigned packaging smoke build per OS (brief §5.9); the steps live once, in .github/actions/package. Required checks: package (ubuntu-latest), package (macos-latest), package (windows-latest).
  # Same shape as `check`: one explicit job per required name, never a matrix. macOS and Windows are skipped on pull_request (a skipped required check counts as passing, so PRs are not blocked) and run for real on merge_group and push to main. The Linux job runs on every PR; the action only does the work when the PR touches packaging inputs, otherwise it succeeds without building (documented in the action).
  # `needs` only orders after the check jobs; check-macos/check-windows are skipped on pull_request, which would skip these jobs too, so run unless something failed or the run was cancelled. A merge_group run never skips: its check jobs are never skipped, and a failed one fails the queue entry itself.
  package-linux:
    name: package (ubuntu-latest)
    needs: [check-linux, check-macos, check-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package

  package-macos:
    name: package (macos-latest)
    needs: [check-linux, check-macos, check-windows]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package

  package-windows:
    name: package (windows-latest)
    needs: [check-linux, check-macos, check-windows]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package

  # Electron end-to-end tests (M4-19, ADR 0017); the steps live once, in .github/actions/e2e. Required checks: e2e (ubuntu-latest), e2e (macos-latest), e2e (windows-latest). Same OS policy as `package`: PRs run Linux, the merge queue and main run all three.
  e2e-linux:
    name: e2e (ubuntu-latest)
    # The Linux runner is pinned: the baselines are rasterised there, and `ubuntu-latest` moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e

  e2e-macos:
    name: e2e (macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e

  e2e-windows:
    name: e2e (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e

  # Eval regression gate (M1-11): runs the pipeline over the small seeded fixture, scores precision and
  # recall per category and per signal, and fails when any class drops more than the tolerance below
  # eval/baseline.small.json. Refresh the baseline on purpose with `pnpm --filter @pochimail/testing eval:update-baseline`.
  # Required check: keep the job name stable for branch protection.
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval against the committed baseline
        run: pnpm eval
      - name: The gate must trip on a degraded classifier
        run: |
          if EVAL_DEGRADE=1 pnpm eval; then
            echo "::error::A deliberately degraded classifier passed the eval gate"
            exit 1
          fi
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: packages/testing/eval/report.json
          retention-days: 14
          if-no-files-found: error

  # Scans the pinned lockfile against OSV; any known vulnerability fails the job (superset of "critical").
  # Required check. Accepted risks live in osv-scanner.toml (time-boxed ignores with a reason).
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
