name: CI

on:
  pull_request:
  # GitHub merge queue: every required job below (check x3, eval, osv-scanner) runs for real on merge_group; only macOS/Windows `check` are skipped, and only on pull_request.
  merge_group:
    types: [checks_requested]
  # Feature-branch pushes are covered by pull_request; only run push CI on main (avoids double runs).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is unique per merge queue entry (refs/heads/gh-readonly-queue/...), so entries never share a group; never cancel queue runs.
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  # Required status checks (branch protection), names must stay stable:
  #   check (ubuntu-latest), check (macos-latest), check (windows-latest), eval
  # Pull requests get fast Linux feedback only. macOS and Windows are skipped on pull_request (GitHub treats a skipped required check as passing) and run for real on merge_group and push to main, so no PR or merge-queue entry can reach main without the 3-OS gate. Direct pushes by admins are a branch-protection setting (enforce_admins), not covered here.
  # These are explicit jobs, not a matrix: a matrix job skipped by a job-level `if` reports the unexpanded name `check (${{ matrix.os }})`, so the required names would never appear and the PR would block. The steps live once, in .github/actions/check.
  check-linux:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  check-macos:
    name: check (macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  check-windows:
    name: check (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  # Unsigned packaging smoke build per OS (brief §5.9). The smoke also proves the encrypted WAL SQLite database with FTS5 inside the packaged app (M0-12). Runs on all three OSes on merge_group and main; on PRs it runs ubuntu only, and only when the PR touches packaging inputs.
  # Not a required check, and it stays scoped (the scope step below reports run=false when a PR touches nothing relevant). When a PR touches nothing relevant the job still runs and reports success, but every step after the scope check is skipped.
  package:
    name: package (${{ matrix.os }})
    needs: [check-linux, check-macos, check-windows]
    # check-macos/check-windows are skipped on pull_request, which would skip this job too; run unless something failed or the run was cancelled.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether packaging inputs changed
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$EVENT" = merge_group ] || { [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; }; then
            run=true
          elif [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --name-only "$BASE_SHA" HEAD | grep -E '^apps/desktop/(build|packaging/|src/(main|worker)/|electron-builder\.config\.ts|package\.json)|^\.github/workflows/ci\.yml$|^pnpm-(lock|workspace)\.yaml$'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Linux packaging tools
        if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xvfb
      - name: Package
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @pochimail/desktop package
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: steps.scope.outputs.run == 'true' && runner.os != 'Linux'
        run: pnpm --filter @pochimail/desktop package:smoke
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:smoke
      - name: Report artifact sizes
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @pochimail/desktop package:size "${{ runner.os }} artifacts"
      - name: Upload artifacts
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pochimail-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          retention-days: 7
          if-no-files-found: error

  # Electron end-to-end tests (M4-19, ADR 0017): the onboarding smoke runs on every OS, the light/dark picture tests on Linux only (baselines are Linux). Same OS policy as `package`: PRs get Linux; the merge queue and main run all three. Not a required check.
  e2e:
    name: e2e (${{ matrix.os }})
    # The Linux runner is pinned: the baselines are rasterised there, and `ubuntu-latest` moves.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: E2E
        if: runner.os != 'Linux'
        run: pnpm --filter @pochimail/desktop e2e
      - name: E2E
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @pochimail/desktop e2e
      # Missing baselines are written by the run itself: this is where new or deleted ones come from (ADR 0017).
      - name: Upload baselines
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: apps/desktop/e2e/__screenshots__
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ runner.os }}
          path: apps/desktop/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Eval regression gate (M1-11): runs the pipeline over the small seeded fixture, scores precision and
  # recall per category and per signal, and fails when any class drops more than the tolerance below
  # eval/baseline.small.json. Refresh the baseline on purpose with `pnpm --filter @pochimail/testing eval:update-baseline`.
  # Required check: keep the job name stable for branch protection.
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval against the committed baseline
        run: pnpm eval
      - name: The gate must trip on a degraded classifier
        run: |
          if EVAL_DEGRADE=1 pnpm eval; then
            echo "::error::A deliberately degraded classifier passed the eval gate"
            exit 1
          fi
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: packages/testing/eval/report.json
          retention-days: 14
          if-no-files-found: error

  # Scans the pinned lockfile against OSV; any known vulnerability fails the job (superset of "critical").
  # Required check. Accepted risks live in osv-scanner.toml (time-boxed ignores with a reason).
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
