name: e2e
description: Electron end-to-end tests for one OS (M4-19, ADR 0017). The onboarding smoke runs on every OS, the light/dark picture tests on Linux only (baselines are Linux). The caller must run actions/checkout first.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install Linux display server
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      shell: bash
    - name: E2E
      if: runner.os != 'Linux'
      run: pnpm --filter @pochimail/desktop e2e
      shell: bash
    - name: E2E
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @pochimail/desktop e2e
      shell: bash
    # Missing baselines are written by the run itself: this is where new or deleted ones come from (ADR 0017).
    - name: Upload baselines
      if: always() && runner.os == 'Linux'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-screenshots
        path: apps/desktop/e2e/__screenshots__
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload failures
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-results-${{ runner.os }}
        path: apps/desktop/e2e/test-results
        retention-days: 7
        if-no-files-found: ignore
