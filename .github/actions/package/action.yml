name: package
description: Unsigned packaging smoke build for one OS (brief §5.9), including the encrypted SQLite smoke (M0-12). On a pull request or merge queue entry it only does the work when the change touches packaging inputs; otherwise every step after the scope check is skipped and the job still succeeds. The caller must run actions/checkout first.
runs:
  using: composite
  steps:
    - name: Decide whether packaging inputs changed
      id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      run: |
        run=false
        if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^apps/desktop/(build|packaging/|src/(main|worker)/|electron-builder\.config\.ts|package\.json)|^\.github/(workflows/ci\.yml|actions/package/)|^pnpm-(lock|workspace)\.yaml$'; then
            run=true
          fi
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
    - if: steps.scope.outputs.run == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - if: steps.scope.outputs.run == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: steps.scope.outputs.run == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install Linux packaging tools
      if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xvfb
      shell: bash
    - name: Package
      if: steps.scope.outputs.run == 'true'
      run: pnpm --filter @pochimail/desktop package
      shell: bash
    - name: Smoke (fuses, headless launch, encrypted SQLite)
      if: steps.scope.outputs.run == 'true' && runner.os != 'Linux'
      run: pnpm --filter @pochimail/desktop package:smoke
      shell: bash
    - name: Smoke (fuses, headless launch, encrypted SQLite)
      if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
      run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:smoke
      shell: bash
    # Installs each artifact the way a person does (dmg copy, silent NSIS, deb, rpm, AppImage), launches it and checks its version.
    - name: Install and launch each artifact
      if: steps.scope.outputs.run == 'true' && runner.os != 'Linux'
      run: pnpm --filter @pochimail/desktop package:install
      shell: bash
    - name: Install and launch each artifact
      if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
      run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:install
      shell: bash
    - name: Report artifact sizes
      if: steps.scope.outputs.run == 'true'
      run: pnpm --filter @pochimail/desktop package:size "${{ runner.os }} artifacts"
      shell: bash
    - name: Upload artifacts
      if: steps.scope.outputs.run == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pochimail-${{ runner.os }}
        path: |
          apps/desktop/release/*.dmg
          apps/desktop/release/*.exe
          apps/desktop/release/*.AppImage
          apps/desktop/release/*.deb
          apps/desktop/release/*.rpm
        retention-days: 7
        if-no-files-found: error
